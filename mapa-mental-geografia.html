<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Mental de Geografia</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d2a24;--mut:#66706b;--bd:#dcdad2;--ac:#1f6f5c;
--c0:#1f6f5c;--c1:#b4572a;--c2:#3b5ba5;--c3:#a0364f;--c4:#7a6a1c;--c5:#6a4a9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--card:#1e2426;--tx:#e8ece9;--mut:#9aa5a0;--bd:#2f3739;--ac:#4fb59c;
--c0:#4fb59c;--c1:#e08a5c;--c2:#7f9be0;--c3:#e07a92;--c4:#d2c25a;--c5:#a98be0}}
:root[data-theme="dark"]{--bg:#15191a;--card:#1e2426;--tx:#e8ece9;--mut:#9aa5a0;--bd:#2f3739;--ac:#4fb59c;
--c0:#4fb59c;--c1:#e08a5c;--c2:#7f9be0;--c3:#e07a92;--c4:#d2c25a;--c5:#a98be0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:grid;gap:10px}
label{font-size:.8rem;color:var(--mut);display:grid;gap:4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
button:disabled{opacity:.6}
#msg{color:var(--mut);font-size:.9rem;margin:10px 2px}
#out{margin-top:14px}
.center{background:var(--ac);color:#fff;border-radius:16px;padding:14px;text-align:center}
.center h2{margin:0;font-size:1.2rem}
.center p{margin:6px 0 0;font-size:.9rem;opacity:.95}
.trunk{width:3px;height:14px;background:var(--bd);margin:0 auto}
.branch{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:12px;margin:0 0 10px;overflow:hidden}
.branch>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;color:var(--c);display:flex;justify-content:space-between}
.branch>summary::-webkit-details-marker{display:none}
.branch>summary::after{content:"▾";color:var(--mut)}
.branch:not([open])>summary::after{content:"▸"}
.branch ul{margin:0;padding:0 14px 12px 14px;list-style:none;display:grid;gap:8px}
.branch li{padding-left:12px;border-left:2px solid var(--c)}
.branch li b{display:block}
.branch li span{color:var(--mut);font-size:.92rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.board{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:1rem;line-height:1.6;user-select:text}
.note{font-size:.8rem;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>🗺️ Mapa Mental de Geografia</h1>
<div class="box">
  <label>Assunto da aula
    <input id="tema" placeholder="Ex.: Globalização, Urbanização brasileira, Guerra Fria…" autocomplete="off">
  </label>
  <div class="row">
    <label>Nível
      <select id="nivel">
        <option>Ensino Fundamental II</option>
        <option selected>Ensino Médio</option>
        <option>Pré-vestibular / ENEM</option>
        <option>Graduação</option>
      </select>
    </label>
    <label>Tamanho
      <select id="tam">
        <option value="3">Enxuto</option>
        <option value="4" selected>Médio</option>
        <option value="6">Completo</option>
      </select>
    </label>
  </div>
  <label>Foco opcional (ex.: Brasil, ENEM, geopolítica)
    <input id="foco" autocomplete="off">
  </label>
  <button id="go">Gerar mapa</button>
</div>
<div id="msg"></div>
<div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["--c0","--c1","--c2","--c3","--c4","--c5"];
let sample = null, data = null;

(async () => {
  try { sample = await claude.use("sample"); } catch(e) {}
  if (!sample) $("msg").textContent = "A geração automática não está disponível neste ambiente.";
})();

function prompt(tema, nivel, n, foco){
  return `Você é um professor experiente de Geografia no Brasil. Monte um quadro/mapa mental em português do Brasil sobre: "${tema}". Público: ${nivel}.${foco ? " Foco: " + foco + "." : ""}
Responda SOMENTE com JSON válido, sem markdown, neste formato:
{"tema":"título curto","resumo":"1 frase com a ideia central","ramos":[{"titulo":"...","itens":[{"titulo":"termo/nome curto","detalhe":"1 a 2 frases com a informação que o professor escreveria no quadro: definição, autor com obra e ideia central, data e fato, ou exemplo concreto"}]}]}
Use exatamente estes ramos, nesta ordem: "Conceitos-chave", "Autores e teorias", "Fatos históricos", "Atualidades e notícias", "Exemplos e casos", "Perguntas para debate".
Cada ramo com cerca de ${n} itens. Regras de precisão: não invente autores, datas, obras ou números; se tiver dúvida, escreva "(confirmar)" no detalhe. Em "Atualidades e notícias", não cite manchetes específicas: indique temas e eventos recentes conhecidos e diga o que pesquisar (ex.: "buscar notícias sobre X"). Em "Perguntas para debate", o título é a pergunta e o detalhe pode ficar vazio.`;
}

function parse(t){
  t = t.replace(/```json|```/g,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  return JSON.parse(t.slice(a, b+1));
}

function render(){
  const out = $("out"); out.textContent = "";
  const acts = document.createElement("div"); acts.className = "actions";
  const cp = document.createElement("button"); cp.className = "sec"; cp.textContent = "Copiar como texto";
  cp.onclick = copyText; acts.appendChild(cp);
  const dl = document.createElement("button"); dl.className = "sec"; dl.textContent = "Salvar .txt";
  dl.onclick = saveText; acts.appendChild(dl);
  out.appendChild(acts);

  const c = document.createElement("div"); c.className = "center";
  const h = document.createElement("h2"); h.textContent = data.tema;
  const p = document.createElement("p"); p.textContent = data.resumo || "";
  c.append(h, p); out.appendChild(c);
  const tr = document.createElement("div"); tr.className = "trunk"; out.appendChild(tr);

  data.ramos.forEach((r, i) => {
    const d = document.createElement("details"); d.className = "branch"; d.open = true;
    d.style.setProperty("--c", `var(${COLORS[i % COLORS.length]})`);
    const s = document.createElement("summary"); s.textContent = r.titulo; d.appendChild(s);
    const ul = document.createElement("ul");
    (r.itens || []).forEach(it => {
      const li = document.createElement("li");
      const b = document.createElement("b"); b.textContent = it.titulo; li.appendChild(b);
      if (it.detalhe){ const sp = document.createElement("span"); sp.textContent = it.detalhe; li.appendChild(sp); }
      ul.appendChild(li);
    });
    d.appendChild(ul); out.appendChild(d);
  });
  const n = document.createElement("div"); n.className = "note";
  n.textContent = "Conteúdo gerado por IA: confira autores, datas e dados antes de levar para a aula, e busque as notícias atuais nas fontes.";
  out.appendChild(n);
}

function renderText(){
  const out = $("out"); out.textContent = "";
  const acts = document.createElement("div"); acts.className = "actions";
  const cp = document.createElement("button"); cp.textContent = "Copiar texto"; cp.onclick = copyText;
  const dl = document.createElement("button"); dl.className = "sec"; dl.textContent = "Salvar .txt"; dl.onclick = saveText;
  acts.append(cp, dl); out.appendChild(acts);
  const pre = document.createElement("div"); pre.className = "board"; pre.textContent = asText();
  out.appendChild(pre);
  const n = document.createElement("div"); n.className = "note";
  n.textContent = "Gerado por IA: confira autores, datas e dados antes da aula e busque as notícias atuais nas fontes.";
  out.appendChild(n);
}

function asText(){
  let t = data.tema.toUpperCase() + "\n" + (data.resumo || "") + "\n";
  data.ramos.forEach(r => {
    t += "\n■ " + r.titulo.toUpperCase() + "\n";
    (r.itens || []).forEach(it => { t += "  • " + it.titulo + (it.detalhe ? " — " + it.detalhe : "") + "\n"; });
  });
  return t;
}
async function copyText(){
  try { await navigator.clipboard.writeText(asText()); $("msg").textContent = "Copiado!"; }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = asText(); document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); $("msg").textContent = "Copiado!"; }catch(_){ $("msg").textContent = "Não consegui copiar; selecione o texto manualmente."; }
    ta.remove();
  }
}
async function saveText(){
  try {
    const dls = await claude.use("downloads");
    if (!dls) { $("msg").textContent = "Download indisponível aqui; use 'Copiar como texto'."; return; }
    await dls.save({ filename: "mapa-" + data.tema.replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,40) + ".txt", data: asText() });
  } catch(e){ $("msg").textContent = "Não foi possível salvar; use 'Copiar como texto'."; }
}

$("go").onclick = async () => {
  const tema = $("tema").value.trim();
  if (!tema){ $("msg").textContent = "Digite o assunto da aula."; return; }
  if (!sample){ $("msg").textContent = "A geração automática não está disponível neste ambiente."; return; }
  $("go").disabled = true; $("msg").textContent = "Montando o quadro…"; $("out").textContent = "";
  try {
    const res = await sample(prompt(tema, $("nivel").value, $("tam").value, $("foco").value.trim()), { cache:false });
    data = parse(res.text);
    $("msg").textContent = ""; renderText();
  } catch(e){
    $("msg").textContent = e && e.code === "rate_limited" ? "Muitas tentativas. Aguarde um pouco." :
      e && e.code === "not_granted" ? "Permissão negada para gerar conteúdo." : "Não deu certo. Tente de novo.";
  }
  $("go").disabled = false;
};
$("tema").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
