<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Quadros de Geografia</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2a24;--mut:#66706b;--bd:#dcdad2;--ac:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--card:#1e2426;--tx:#e8ece9;--mut:#9aa5a0;--bd:#2f3739;--ac:#2f8f78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
label{font-size:.8rem;color:var(--mut);display:grid;gap:4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--tx)}
.chk input{width:auto}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
button:disabled{opacity:.6}
#msg{color:var(--mut);font-size:.9rem;margin:8px 2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.board{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;line-height:1.6;user-select:text}
.note{font-size:.8rem;color:var(--mut);margin-top:10px}
details>summary{cursor:pointer;font-weight:600}
.hist{display:grid;gap:6px;margin-top:8px}
.hist button{text-align:left;font-weight:500}
</style>
</head>
<body>
<main>
<h1>🗺️ Gerador de Quadros de Geografia</h1>

<div class="box">
  <label>Assunto da aula
    <input id="tema" placeholder="Ex.: Globalização, Urbanização brasileira, Guerra Fria…" autocomplete="off">
  </label>
  <div class="row">
    <label>Nível
      <select id="nivel">
        <option>Ensino Fundamental II</option>
        <option selected>Ensino Médio</option>
        <option>Pré-vestibular / ENEM</option>
        <option>Graduação</option>
      </select>
    </label>
    <label>Tamanho
      <select id="tam">
        <option value="3">Enxuto</option>
        <option value="4" selected>Médio</option>
        <option value="6">Completo</option>
      </select>
    </label>
  </div>
  <label>Foco opcional (ex.: Brasil, ENEM, geopolítica)
    <input id="foco" autocomplete="off">
  </label>
  <label class="chk"><input type="checkbox" id="web" checked> Buscar informações recentes</label>
  <button id="go">Gerar quadro</button>
</div>

<div id="msg"></div>
<div id="out"></div>

<details class="box" id="histbox" style="display:none">
  <summary>📚 Meus quadros salvos</summary>
  <div class="hist" id="hist"></div>
</details>
</main>

<script>
const API_KEY = AQ.Ab8RN6L9oZiWcp_BkYCcCgEIQOk_a8DN-xSEEWKgkC-BrQ56Qg;
const MODEL = "gemini-2.5-flash-lite";
const $ = id => document.getElementById(id);
let current = "";

const ls = (op, k, v) => { try { return op === "get" ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch(e){ return null; } };

function prompt_(tema, nivel, n, foco, web){
  return `Você é um professor experiente de Geografia no Brasil. Monte o quadro de aula sobre "${tema}" para ${nivel}.${foco ? " Foco: " + foco + "." : ""}
Responda em português do Brasil, em TEXTO PURO (sem markdown, sem asteriscos, sem tabelas), pronto para copiar para o quadro. Formato:
TÍTULO EM MAIÚSCULAS
Ideia central em 1 frase.

■ CONCEITOS-CHAVE
  • termo — definição em 1 frase
■ AUTORES E TEORIAS
  • nome (ano) — obra e ideia central
■ FATOS HISTÓRICOS
  • data — o que aconteceu e por que importa
■ ATUALIDADES E NOTÍCIAS
  • ${web ? "notícia ou fato recente real, com a fonte e o mês/ano" : "tema atual e o que pesquisar (não cite manchetes específicas)"}
■ EXEMPLOS E CASOS
  • exemplo concreto
■ PERGUNTAS PARA DEBATE
  • pergunta
Cerca de ${n} itens por bloco. Não invente autores, datas, obras, números nem notícias; se tiver dúvida, escreva (confirmar). Não escreva nada além do quadro.`;
}

async function call(text, web){
  const body = { contents:[{role:"user",parts:[{text}]}], generationConfig:{maxOutputTokens:8000} };
  if (web) body.tools = [{google_search:{}}];
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(MODEL) + ":generateContent", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-goog-api-key":API_KEY },
    body:JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && j.error.message) || "Erro"); e.status = r.status; throw e; }
  const c = j.candidates && j.candidates[0];
  const t = c && c.content && c.content.parts ? c.content.parts.map(p => p.text || "").join("").trim() : "";
  if (!t) throw new Error("Resposta vazia. Tente de novo.");
  return t.replace(/\*\*/g, "");
}

$("go").onclick = async () => {
  const tema = $("tema").value.trim();
  const nivel = $("nivel").value, n = $("tam").value, foco = $("foco").value.trim();
  if (!API_KEY || API_KEY === "COLE_SUA_CHAVE_AQUI"){ $("msg").textContent = "Falta inserir a chave no código."; return; }
  if (!tema){ $("msg").textContent = "Digite o assunto da aula."; return; }

  $("go").disabled = true; $("out").textContent = "";
  $("msg").textContent = $("web").checked ? "Buscando informações…" : "Montando o quadro…";
  try {
    let txt, aviso = "";
    if ($("web").checked){
      try { txt = await call(prompt_(tema,nivel,n,foco,true), true); }
      catch(e){
        if ((e.status === 400 && /key/i.test(e.message)) || e.status === 403 || e.status === 404) throw e;
        aviso = "Busca recente indisponível, gerado sem notícias.";
        txt = await call(prompt_(tema,nivel,n,foco,false), false);
      }
    } else txt = await call(prompt_(tema,nivel,n,foco,false), false);
    current = txt; show(txt); save(tema, txt);
    $("msg").textContent = aviso;
  } catch(e){
    $("msg").textContent =
      (e.status === 400 && /key/i.test(e.message)) || e.status === 403 ? "Chave inválida ou sem permissão." :
      e.status === 404 ? "Modelo não encontrado." :
      e.status === 429 ? "Limite de uso atingido. Aguarde um pouco." :
      "Não deu certo: " + e.message;
  }
  $("go").disabled = false;
};
$("tema").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

function show(txt){
  const out = $("out"); out.textContent = "";
  const a = document.createElement("div"); a.className = "actions";
  const c = document.createElement("button"); c.textContent = "Copiar texto"; c.onclick = copy;
  const d = document.createElement("button"); d.className = "sec"; d.textContent = "Salvar .txt"; d.onclick = download;
  a.append(c, d); out.appendChild(a);
  const b = document.createElement("div"); b.className = "board"; b.textContent = txt; out.appendChild(b);
  const n = document.createElement("div"); n.className = "note";
  n.textContent = "Confira autores, datas e dados antes da aula.";
  out.appendChild(n);
}
async function copy(){
  try { await navigator.clipboard.writeText(current); $("msg").textContent = "Copiado!"; }
  catch(e){
    const t = document.createElement("textarea"); t.value = current; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); $("msg").textContent = "Copiado!"; } catch(_){ $("msg").textContent = "Selecione o texto e copie manualmente."; }
    t.remove();
  }
}
function download(){
  const u = URL.createObjectURL(new Blob([current], {type:"text/plain;charset=utf-8"}));
  const a = document.createElement("a"); a.href = u;
  a.download = "quadro-" + ($("tema").value.trim().replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,40) || "geografia") + ".txt";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

function load(){ try { return JSON.parse(ls("get","qg_hist") || "[]"); } catch(e){ return []; } }
function save(tema, txt){
  const h = load().filter(x => x.tema !== tema);
  h.unshift({tema, txt, d:new Date().toLocaleDateString("pt-BR")});
  ls("set","qg_hist", JSON.stringify(h.slice(0,30))); renderHist();
}
function renderHist(){
  const h = load(), box = $("hist"); box.textContent = "";
  $("histbox").style.display = h.length ? "" : "none";
  h.forEach(x => {
    const b = document.createElement("button"); b.className = "sec"; b.textContent = x.tema + " · " + x.d;
    b.onclick = () => { current = x.txt; $("tema").value = x.tema; show(x.txt); window.scrollTo(0,0); };
    box.appendChild(b);
  });
}
renderHist();
</script>
</body>
</html>
